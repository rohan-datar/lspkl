[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
insta = "1.43.2"
text-size = "1.1"
line-index = "0.1"
tree-sitter = "0.25"

salsa = "0.28"
la-arena = "0.3"
bitflags = "2"
parking_lot = "0.12"
url = "2"
fluent-uri = "0.4.1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
lsp-server = "0.10"
crossbeam-channel = "0.5"
lsp-types = "0.97"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
globset = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
sha2 = "0.10"
percent-encoding = "2"

# Path deps
lspkl-stdlib = { version = "0.1.0", path = "crates/lspkl-stdlib" }
lspkl-db = { version = "0.1.0", path = "crates/lspkl-db" }
lspkl-syntax = { version = "0.1.0", path = "crates/lspkl-syntax" }
lspkl-vfs = { version = "0.1.0", path = "crates/lspkl-vfs" }
lspkl-types = { version = "0.1.0", path = "crates/lspkl-types" }
lspkl-diagnostics = { version = "0.1.0", path = "crates/lspkl-diagnostics" }
lspkl-project = { version = "0.1.0", path = "crates/lspkl-project" }
lspkl-features = { version = "0.1.0", path = "crates/lspkl-features" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
