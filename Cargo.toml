[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
insta = "1.43.2"
tree-sitter = "0.25"
tree-sitter-pkl = { git = "https://github.com/apple/tree-sitter-pkl" }

# Phase 2: VFS + LSP skeleton
dashmap = "6"
url = "2"
fluent-uri = "0.4.1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-lsp-server = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

# Path deps
pkl-analysis = { path = "crates/pkl-analysis" }
pkl-vfs = { path = "crates/pkl-vfs" }
pkl-types = { path = "crates/pkl-types" }
pkl-diagnostics = { path = "crates/pkl-diagnostics" }
lspkl = { path = "crates/lspkl" }
