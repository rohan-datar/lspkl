[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
insta = "1.43.2"
tree-sitter = "0.25"
tree-sitter-pkl = { git = "https://github.com/apple/tree-sitter-pkl", tag = "v0.21.0" }

dashmap = "6"
parking_lot = "0.12"
url = "2"
fluent-uri = "0.4.1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-lsp-server = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
globset = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
percent-encoding = "2"

# Path deps
pkl-stdlib = { path = "crates/pkl-stdlib" }
pkl-syntax = { path = "crates/pkl-syntax" }
pkl-vfs = { path = "crates/pkl-vfs" }
pkl-types = { path = "crates/pkl-types" }
pkl-diagnostics = { path = "crates/pkl-diagnostics" }
pkl-project = { path = "crates/pkl-project" }
lsp-features = { path = "crates/lsp-features" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
