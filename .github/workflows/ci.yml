name: CI and releases

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Serialize fixture execution to avoid the known Unix CLI fixture ETXTBSY race.
      # No production retries; run the full suite of host-supported tests.
      - run: cargo test --workspace --locked -- --test-threads=1

  build:
    name: Release archive (${{ matrix.target }})
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            cross: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: extractions/setup-just@v3
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq file binutils tar zip unzip
      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: brew install jq file zip unzip
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          install: jq file zip unzip coreutils tar
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if [[ -n "$MSYS2_LOCATION" ]]; then
            msys_bin="$(cygpath -u "$MSYS2_LOCATION")/usr/bin"
            PATH="$PATH:$msys_bin"
            export PATH
          fi
          if [[ "$REF_TYPE" == tag ]]; then
            just release-version "$REF_NAME"
          else
            just release-version
          fi
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build release target
        run: just release-build '${{ matrix.target }}'
      - name: Package and validate unpacked binary
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if [[ -n "$MSYS2_LOCATION" ]]; then
            msys_bin="$(cygpath -u "$MSYS2_LOCATION")/usr/bin"
            PATH="$PATH:$msys_bin"
            export PATH
          fi
          just release-package '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: lspkl-${{ matrix.target }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.zip
            target/release-artifacts/SHA256SUMS
          if-no-files-found: error

  benchmark:
    name: Binary size and startup measurements
    needs: [quality, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark
      - run: cargo build --release --locked -p lspkl --bin lspkl --example measure
      - name: Measure real stdio initialization and first analysis
        run: >-
          cargo run --release --locked -p lspkl --example measure --
          --binary target/release/lspkl --iterations 20 > target/measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-linux-x86_64
          path: target/measurements.json
          if-no-files-found: error

  nix:
    name: Sandboxed Nix package and smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - run: nix flake check --print-build-logs
      - run: nix run .#lspkl -- --version

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, benchmark, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - uses: actions/download-artifact@v4
        with:
          pattern: lspkl-*
          path: target/release-artifacts
          merge-multiple: true
      - name: Validate tag and aggregate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          just release-version "$RELEASE_TAG"
          just release-checksums
      - name: Publish archives and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          target/release-artifacts/*.tar.gz
          target/release-artifacts/*.zip
          target/release-artifacts/SHA256SUMS
          --verify-tag --title "lspkl $RELEASE_TAG" --generate-notes