name: CI and releases

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    uses: ./.github/workflows/checks.yml

  nix:
    name: Nix package
    uses: ./.github/workflows/nix.yml

  artifacts:
    name: Release artifacts and measurements
    needs: checks
    uses: ./.github/workflows/artifacts.yml

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [checks, nix, artifacts]
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
