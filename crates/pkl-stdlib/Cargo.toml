[package]
name = "pkl-stdlib"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Build-time downloaded and embedded Pkl standard library"
repository = "https://github.com/rohan-datar/lspkl"
readme = "README.md"

[build-dependencies]
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
