[package]
name = "lsp-features"
version = "0.1.0"
edition = "2024"
description = "Language Server Protocol features for the lspkl Pkl language server"
license = "Apache-2.0"
repository = "https://github.com/rohan-datar/lspkl"
readme = "README.md"
# These integration tests share support code with other workspace crates.
exclude = ["tests/**"]

[dependencies]
pkl-db.workspace = true
pkl-project.workspace = true
serde_json.workspace = true
pkl-syntax.workspace = true
pkl-types.workspace = true
pkl-vfs.workspace = true
pkl-diagnostics.workspace = true
lsp-types.workspace = true
fluent-uri.workspace = true

[dev-dependencies]
pkl-syntax.workspace = true
pkl-types.workspace = true
