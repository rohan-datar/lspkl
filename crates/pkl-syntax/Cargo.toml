[package]
name = "pkl-syntax"
version = "0.1.0"
edition = "2024"
description = "Pkl parsing and typed syntax trees for the lspkl language server"
license = "Apache-2.0"
repository = "https://github.com/rohan-datar/lspkl"
readme = "README.md"

[dependencies]
text-size.workspace = true
line-index.workspace = true
tree-sitter.workspace = true
tree-sitter-language = "0.1"
smallvec = "1.13"
thiserror = "2.0"

[dev-dependencies]
insta.workspace = true

[build-dependencies]
cc = "1.2"
