[package]
name = "lspkl-features"
version = "0.1.0"
edition = "2024"
description = "Language Server Protocol features for the lspkl Pkl language server"
license = "Apache-2.0"
repository = "https://github.com/rohan-datar/lspkl"
readme = "README.md"
# These integration tests share support code with other workspace crates.
exclude = ["tests/**"]

[dependencies]
lspkl-db.workspace = true
lspkl-project.workspace = true
serde_json.workspace = true
lspkl-syntax.workspace = true
lspkl-types.workspace = true
lspkl-vfs.workspace = true
lspkl-diagnostics.workspace = true
lsp-types.workspace = true
fluent-uri.workspace = true

[dev-dependencies]
lspkl-syntax.workspace = true
lspkl-types.workspace = true
