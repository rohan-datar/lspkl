[package]
name = "lspkl"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lspkl"
path = "src/main.rs"

[dependencies]
pkl-db.workspace = true
salsa.workspace = true
pkl-diagnostics.workspace = true
pkl-syntax.workspace = true
pkl-types.workspace = true
pkl-vfs.workspace = true
pkl-project.workspace = true
lsp-features.workspace = true
lsp-server.workspace = true
crossbeam-channel.workspace = true
lsp-types.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fluent-uri.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
fluent-uri.workspace = true
tempfile.workspace = true
url.workspace = true
zip.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
