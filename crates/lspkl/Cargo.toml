[package]
name = "lspkl"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lspkl"
path = "src/main.rs"

[dependencies]
pkl-analysis.workspace = true
pkl-vfs.workspace = true
tower-lsp-server.workspace = true
tokio = { workspace = true, features = ["full"] }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
url.workspace = true
serde_json.workspace = true
